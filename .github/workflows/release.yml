name: Package Linux release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 30

    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm git cmake curl glfw-x11 libx11 libxrandr libxtst mesa ttf-dejavu

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel "$(nproc)"

      - name: Package
        run: >-
          tar -czf sourcesight-linux-x64.tar.gz
          -C build sourcesight
          -C .. README.md LICENSE scripts/install-omarchy.sh

      - uses: actions/upload-artifact@v7
        with:
          name: sourcesight-linux-release
          path: sourcesight-linux-x64.tar.gz
          if-no-files-found: error