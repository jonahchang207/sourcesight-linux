name: Build and release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: microsoft/setup-msbuild@v3
      - name: Build
        run: msbuild sourcesight.sln /p:Configuration=Release /p:Platform=x64
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package
          Copy-Item -Path x64/Release/* -Destination package -Recurse
          Copy-Item README.md,LICENSE -Destination package
          Compress-Archive -Path package/* -DestinationPath sourcesight-windows-x64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: sourcesight-windows-x64.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm git cmake curl glfw-x11 libx11 libxrandr mesa ttf-dejavu
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
      - name: Package
        run: tar -czf sourcesight-linux-x64.tar.gz -C build sourcesight -C .. README.md LICENSE scripts/install-omarchy.sh
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: sourcesight-linux-x64.tar.gz
          if-no-files-found: error

  release:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: release-${{ github.run_number }}
          name: SourceSight release ${{ github.run_number }}
          generate_release_notes: true
          files: release/*
