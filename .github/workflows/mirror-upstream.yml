name: Mirror official upstream

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mirror official branches and tags
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/IMXNOOBX/cs2-external-esp.git
          git fetch upstream '+refs/heads/*:refs/remotes/upstream/*' --prune

          while IFS= read -r branch; do
            git push origin "refs/remotes/upstream/${branch}:refs/heads/${branch}" --force
          done < <(git for-each-ref --format='%(refname:strip=3)' refs/remotes/upstream | grep -v '^HEAD$')

          git fetch upstream '+refs/tags/*:refs/tags/*' --prune --prune-tags
          git push origin --tags --force

          while IFS= read -r tag; do
            if ! git ls-remote --exit-code --tags upstream "refs/tags/${tag}" >/dev/null 2>&1; then
              git push origin --delete "refs/tags/${tag}"
            fi
          done < <(git ls-remote --tags --refs origin | sed 's#.*refs/tags/##')

          while IFS= read -r branch; do
            [[ "${branch}" == "omarchy-port" ]] && continue
            if ! git show-ref --verify --quiet "refs/remotes/upstream/${branch}"; then
              git push origin --delete "${branch}"
            fi
          done < <(git ls-remote --heads origin | sed 's#.*refs/heads/##')
